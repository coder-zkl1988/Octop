id: xhs-ops
version: 0.9.0
name: 小红书运营
description: 内容编辑、手机发布、账号运营、评论审核和老号接管。需要企业单独授权。
icon: icon.svg
group: ops
kind: tool
entry: main.py
requires: [regex]
ui:
  entry: ui/index.js
  manifest: ui/manifest.json
app:
  sdk: 1
  entry: domain.py
  tool_feature: [xhs.content, xhs.ops, xhs.publish, xhs.comment, xhs.takeover, xhs.analytics]
  scheduler: true
  scheduler_features: [xhs.ops]
  commands:
    project.save: [xhs.content, xhs.ops]
    project.delete: [xhs.ops]
    profile.save: [xhs.ops]
    profile.generate: [xhs.ops]
    profile.confirm: [xhs.ops]
    persona.generate: [xhs.ops]
    persona.apply: [xhs.ops]
    persona.save: [xhs.ops]
    personas.confirm: [xhs.ops]
    account.save: [xhs.ops]
    account.delete: [xhs.ops]
    account.transfer_device: [xhs.ops]
    account.prepare: [xhs.ops]
    account.identity: [xhs.ops]
    account.resume: [xhs.ops]
    account_profile.save: [xhs.ops]
    account_profile.review: [xhs.ops]
    account_profile.generate: [xhs.ops]
    account_profile.read: [xhs.ops]
    account_profile.precheck: [xhs.ops]
    account_profile.apply: [xhs.ops]
    account_profile.verify: []
    account_profile.check: [xhs.ops]
    account_profile.reconcile: []
    ops.configure: [xhs.ops]
    ops.save: [xhs.ops]
    ops.precheck: [xhs.ops]
    ops.start: [xhs.ops]
    ops.reconcile: []
    run.note: [xhs.analytics]
    run.create: [xhs.ops]
    draft.save: [xhs.content]
    content.generate: [xhs.content]
    image.generate: [xhs.content]
    batch.save: [xhs.publish]
    batch.precheck: [xhs.publish]
    batch.start: [xhs.publish]
    batch.cancel: []
    run.precheck: [xhs.publish, xhs.ops, xhs.takeover]
    run.start: [xhs.publish, xhs.ops, xhs.takeover]
    run.cancel: []
    run.verify: []
    run.reconcile: []
    comment.generate: [xhs.comment]
    comment.save: [xhs.comment]
    comment.review: [xhs.comment]
    comment.reopen: [xhs.comment]
    comment.precheck: [xhs.comment]
    comment.verify: []
    comment.reconcile: []
    comment.inspect: [xhs.comment]
    comment.approve: [xhs.comment]
    comment.send: [xhs.comment]
    takeover.authorize: [xhs.takeover]
    takeover.pause: [xhs.takeover]
    takeover.resume: [xhs.takeover]
    takeover.device_hold_release: [xhs.takeover]
    takeover.identity.read: [xhs.takeover]
    takeover.identity.confirm: [xhs.takeover]
    takeover.plan.revert: [xhs.takeover]
    audit.confirm: [xhs.takeover]
    audit.baseline: [xhs.takeover]
    audit.cancel: [xhs.takeover]
    diagnosis.generate: [xhs.takeover]
    diagnosis.regenerate: [xhs.takeover]
    diagnosis.decisions: [xhs.takeover]
    diagnosis.confirm: [xhs.takeover]
    change_order.create: [xhs.takeover]
    change_order.image_upload: [xhs.takeover]
    change_order.cancel: [xhs.takeover]
    change_order.precheck: [xhs.takeover]
    change_order.confirm: [xhs.takeover]
    change_order.verify: [xhs.takeover]
    change_order.visual_check: [xhs.takeover]
    change_order.manual_check: [xhs.takeover]
    change_order.observation_review: [xhs.takeover]
    change_order.review: [xhs.takeover]
    change_order.rollback: [xhs.takeover]
    schedule.save: [xhs.ops]
    migration.dry_run: [xhs.ops]
    migration.import: [xhs.ops]
    sync.outbox.list: [xhs.analytics]
    sync.outbox.push: [xhs.analytics]
  read_scopes:
    projects: [xhs.content, xhs.ops, xhs.publish, xhs.takeover]
    accounts: [xhs.ops, xhs.publish, xhs.takeover, xhs.comment]
    persona_candidates: [xhs.ops]
    drafts: [xhs.content, xhs.publish]
    batches: [xhs.publish]
    profile_reads: [xhs.ops, xhs.takeover]
    operation_days: [xhs.ops]
    operation_clock: [xhs.ops]
    reports: [xhs.analytics]
    run_notes: [xhs.analytics]
    evidence: [xhs.publish, xhs.ops, xhs.takeover, xhs.comment]
    runs: [xhs.publish, xhs.ops, xhs.takeover, xhs.comment, xhs.analytics]
    comments: [xhs.comment]
    comment_quotas: [xhs.comment]
    comment_sources: [xhs.comment]
    comment_clock: [xhs.comment]
    audits: [xhs.takeover]
    diagnoses: [xhs.takeover]
    change_orders: [xhs.takeover]
    consents: [xhs.publish, xhs.ops, xhs.takeover]
    prechecks: [xhs.publish, xhs.ops, xhs.takeover]
    audit_outbox: [xhs.analytics]
    migration_imports: [xhs.ops]
    takeover_events: [xhs.takeover, xhs.analytics]
  record_scopes:
    runs:
      kinds:
        publish: [xhs.publish]
        browse: [xhs.ops]
        nurture: [xhs.ops]
        audit: [xhs.takeover]
        profile: [xhs.takeover]
        comment: [xhs.comment]
        comment_check: [xhs.comment]
        account_prepare: [xhs.ops]
        account_identity: [xhs.ops]
        account_profile_read: [xhs.ops]
        account_profile_apply: [xhs.ops]
        account_profile_verify: [xhs.ops]
      summary_fields: [id, kind, status, account_id, device_id, account_version, day_id, day_version, created_at, updated_at]
  features:
    - xhs.content
    - xhs.publish
    - xhs.ops
    - xhs.comment
    - xhs.takeover
    - xhs.analytics
